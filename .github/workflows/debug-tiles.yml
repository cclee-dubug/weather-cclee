name: 診斷圖磚樣本（暫時）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下載模式路徑樣本並推到 debug-fixtures 分支
        run: |
          set +e
          mkdir f && cd f
          D=$(date -u +%Y%m%d)
          for s in oper enfo; do
            curl -s --retry 6 --retry-delay 10 --retry-all-errors -f -o ecmwf_${s}_${D}00.bufr "https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/$D/00z/ifs/0p25/$s/${D}000000-360h-$s-tf.bufr"
          done
          N=https://nomads.ncep.noaa.gov/pub/data/nccf/com/ens_tracker/prod
          for f in aemn ac00 ap01 ap02; do curl -s --http1.1 -f -o gefs_${f}_${D}06.atcfunix "$N/gefs.$D/06/tctrack/$f.t06z.cyclone.trackatcfunix"; done
          ls -la
          ls -la
          git init -q -b debug-fixtures && git add . && git -c user.name=probe -c user.email=probe@example.com commit -q -m fixtures
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-fixtures
