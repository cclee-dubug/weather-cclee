name: probe-colors
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: tiles
        run: |
          mkdir out && cd out
          G=https://gibs.earthdata.nasa.gov/wmts/epsg3857/best
          L=Himawari_AHI_Band13_Clean_Infrared
          curl -sS -m 30 -D h.txt -o /dev/null "$G/$L/default/default/GoogleMapsCompatible_Level6/0/0/0.png"
          T=$(grep -i '^layer-time-actual' h.txt | awk '{print $2}' | tr -d '\r')
          echo "$T" > hima_time.txt
          get() { # z xs xe ys ye
            for x in $(seq $2 $3); do for y in $(seq $4 $5); do
              curl -sS -m 30 -o "hima_${1}_${x}_${y}.png" "$G/$L/default/$T/GoogleMapsCompatible_Level6/$1/$y/$x.png" &
              curl -sS -m 30 -o "coast_${1}_${x}_${y}.png" "$G/Coastlines_15m/default/default/GoogleMapsCompatible_Level13/$1/$y/$x.png" &
            done; wait; done
          }
          get 3 5 7 2 4
          get 4 11 15 5 8
          get 5 24 29 12 15
          get 6 48 59 24 31
          ls | wc -l
      - name: push
        run: |
          cd out
          git init -q -b debug-tiles
          git -c user.name=probe -c user.email=probe@example.com add -A
          git -c user.name=probe -c user.email=probe@example.com commit -qm probe-preview
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug-tiles
