name: 更新模式預報

on:
  schedule:
    # 每小時一次；GFS／GEFS 每 6 小時、ECMWF 每 12 小時才有新的一次起報，沒有新資料時不會推送
    - cron: "28 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-models
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 eccodes（解 ECMWF 的 BUFR 檔）
        run: pip install --quiet eccodes==2.50.0

      - name: 取得上一版
        run: |
          if git fetch --quiet --depth=1 origin model-data; then
            git show FETCH_HEAD:models.json > prev.json
          else
            echo '{}' > prev.json
          fi

      - name: 抓取模式路徑
        run: python3 -m fetcher.models prev.json out/models.json

      # model-data 分支每次都只有一個提交（強制推送），不累積歷史，repo 才不會越來越大
      - name: 推到 model-data 分支
        if: always() && hashFiles('out/models.json') != ''
        run: |
          cd out
          git init --quiet -b model-data
          git add models.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "模式預報 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" model-data
