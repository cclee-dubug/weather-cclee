name: 診斷資料來源（暫時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 探測 UCAR a-deck
        run: |
          set +e
          B=https://hurricanes.ral.ucar.edu/repository/data/adecks_open
          time curl -s -m 120 "$B/" -o list.html
          grep -o -E 'awp[0-9]{2}2026\.dat</a>[^<]*' list.html | sed 's/<\/a>//' | tail -15
          for f in awp292026.dat awp902026.dat awp912026.dat awp922026.dat awp932026.dat awp942026.dat awp952026.dat awp962026.dat awp972026.dat awp982026.dat awp992026.dat; do
            code=$(curl -s -m 120 -o $f -w '%{http_code}' "$B/$f"); echo "== $f $code $(wc -c < $f 2>/dev/null)"
            [ "$code" = 200 ] || continue
            echo "latest DTG: $(cut -d, -f3 $f | sort | tail -1)"
            L=$(cut -d, -f3 $f | sort | tail -1)
            echo "techs in latest DTG:"; grep ",$L," $f | cut -d, -f5 | tr -d ' ' | sort | uniq -c | tr '\n' ' '; echo
            echo "latest DTG per key tech:"; for t in AVNO AVNI AEMN AEMI AC00 AP01 AP30 EMX ECMF EEMN EMXI JGSM JTWC CARQ; do echo -n "$t=$(grep -E "^[^,]*,[^,]*,[^,]*,[^,]*, *$t," $f | cut -d, -f3 | sort | tail -1 | tr -d ' ') "; done; echo
            grep -E ", *AVNO," $f | tail -3
            grep -E ", *AP01," $f | tail -2
          done
          ls -la
