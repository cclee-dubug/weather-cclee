name: 診斷資料來源（暫時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 探測 NOMADS ens_tracker（HTTP/1.1）
        run: |
          python3 - <<'PY2'
          import re, urllib.request, datetime as dt
          UA = {"User-Agent": "typhoon-tracker/1.0"}
          def ls(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                      html = r.read().decode("utf-8", "replace")
              except Exception as e:
                  print("==", url, "ERR", e); return []
              names = [h for h in re.findall(r'href="([^"?/][^"]*)"', html)]
              rows = re.findall(r'href="([^"?][^"]*)">[^<]*</a>\s*([0-9]{2}-[A-Za-z]{3}-[0-9]{4} [0-9:]{5})\s+([0-9.KMG-]+)', html)
              print("==", url, len(html), "bytes", len(names), "entries")
              return rows or [(n, "", "") for n in names]
          D = dt.datetime.utcnow().strftime("%Y%m%d")
          B = "https://nomads.ncep.noaa.gov/pub/data/nccf/com/ens_tracker/prod/"
          for r in ls(B): print("  ", r)
          for model in ("gfs",):
              base = f"{B}{model}.{D}/"
              for r in ls(base): print("  ", r)
              for hh in ("00", "06"):
                  rows = ls(f"{base}{hh}/")
                  for r in rows[:40]: print("  ", r)
                  for sub in [r[0] for r in rows if r[0].endswith("/")][:4]:
                      for r in ls(f"{base}{hh}/{sub}")[:40]: print("    ", r)
          for f in ("gfs.20261023/00/tctrack/avn.t00z.cyclone.trackatcfunix", "gfs.20261023/00/tctrack/gfso.t00z.cyclone.trackatcfunix"):
              try:
                  with urllib.request.urlopen(urllib.request.Request(B + f, headers=UA), timeout=60) as r:
                      t = r.read().decode()
                  print("==", f, len(t)); print("\n".join([l for l in t.splitlines() if l.startswith("WP")][:5]))
              except Exception as e:
                  print("==", f, "ERR", e)
          PY2
