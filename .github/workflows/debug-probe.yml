name: 診斷資料來源（暫時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 探測
        run: |
          set +e
          D=$(date -u +%Y%m%d); Y=$(date -u -d yesterday +%Y%m%d)
          UA="typhoon-tracker/1.0"
          code_of() { echo "$(curl -s -o /dev/null -m 30 -A $UA -w '%{http_code} %{content_type} %{size_download}' "$1") $1"; }
          raw() { echo "== $1"; curl -s -m 30 -A $UA -w '\n[HTTP %{http_code}]\n' "$1" | head -c ${2:-1500}; echo; }
          s3() { echo "== s3 $1 $2"; curl -s -m 30 "https://$1/?list-type=2&delimiter=/&prefix=$2" | grep -o -E '<(Key|Prefix)>[^<]*' | sed 's/<Key>//;s/<Prefix>//' | grep -i -E "${3:-.}" | head -${4:-30}; }
          T=$(curl -s -A $UA https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json | python3 -c "import json,sys;print(json.load(sys.stdin)[-1]['basetime'])")
          for z in "3/6/3" "5/26/13" "5/27/14"; do code_of "https://www.jma.go.jp/bosai/himawari/data/satimg/$T/fd/$T/B13/TBB/$z.jpg"; done
          raw https://nomads.ncep.noaa.gov/pub/data/nccf/com/ens_tracker/prod/ 1500
          raw https://nomads.ncep.noaa.gov/pub/data/nccf/com/gfs/prod/ 600
          raw "https://ftp.ncep.noaa.gov/data/nccf/com/ens_tracker/prod/" 1500
          s3 ecmwf-forecasts.s3.eu-central-1.amazonaws.com "$D/" "" 20
          s3 ecmwf-forecasts.s3.eu-central-1.amazonaws.com "$D/00z/ifs/0p25/oper/" "tf" 20
          s3 ecmwf-forecasts.s3.eu-central-1.amazonaws.com "$D/00z/ifs/0p25/enfo/" "tf" 20
          s3 ecmwf-forecasts.s3.eu-central-1.amazonaws.com "$Y/12z/ifs/0p25/enfo/" "tf" 20
          s3 noaa-gfs-bdp-pds.s3.amazonaws.com "gfs.$D/00/atmos/" "track|atcf|tcvit|cyclone|storm" 20
          s3 noaa-gefs-pds.s3.amazonaws.com "gefs.$D/00/" "" 30
          s3 noaa-gefs-pds.s3.amazonaws.com "gefs.$D/00/atmos/" "" 30
