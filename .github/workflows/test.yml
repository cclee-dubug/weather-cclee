name: 測試

on:
  push:
    branches: [main]
    paths: ["fetcher/**", "tests/**", "tools/**", "assets/colormaps.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet eccodes==2.50.0 numpy==2.5.3 matplotlib==3.11.2
      - run: python3 -m unittest discover -s tests -v
